name: Ndaje API CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installer Java 21 (Temurin) avec cache des dépendances Maven
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Donner le droit d'exécution au wrapper Maven (commité depuis Windows)
      - name: Make mvnw executable
        run: chmod +x mvnw

      # Compiler et lancer les tests
      - name: Build and test
        run: ./mvnw -B verify

      # Construire l'image Docker (sans la pousser pour l'instant)
      - name: Build Docker image
        run: docker build -t ndaje-api .
